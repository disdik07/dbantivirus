<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexGuard Cloud Threat Intelligence Server</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B0F19; color: #F9FAFB; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #111827; border: 1px solid #1F2937; border-radius: 16px; padding: 40px; max-width: 540px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .badge { display: inline-block; background: #064E3B; color: #10B981; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; margin-bottom: 20px; }
        h1 { color: #06B6D4; margin: 0 0 10px 0; font-size: 26px; }
        p { color: #9CA3AF; line-height: 1.6; font-size: 14px; margin-bottom: 25px; }
        .links { display: flex; flex-direction: column; gap: 10px; }
        .link-btn { background: #1F2937; color: #06B6D4; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; border: 1px solid #374151; transition: 0.2s; }
        .link-btn:hover { background: #374151; color: #FFFFFF; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">● Server Online 24/7 (GitHub Cloud)</div>
        <h1>🛡️ ApexGuard Threat Database</h1>
        <p>Official endpoint distribution untuk signature update virus & malware yang ditenagai oleh MalwareBazaar, ThreatFox, dan Cisco ClamAV.</p>
        <div class="links">
            <a href="manifest.json" class="link-btn">📄 Buka manifest.json</a>
            <a href="https://github.com/disdik07/dbantivirus" class="link-btn" target="_blank">📂 Buka GitHub Repository</a>
        </div>
    </div>
</body>
</html>
