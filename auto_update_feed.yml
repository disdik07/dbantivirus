name: Auto Update Malware Database Feed

on:
  schedule:
    # Berjalan otomatis setiap hari pada jam 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub kapan saja
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-threat-database:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Library Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Jalankan Sinkronisasi MalwareBazaar, ThreatFox & ClamAV
        run: |
          python sync_malware_feed.py

      - name: 5. Commit dan Push Perubahan Database Baru ke GitHub
        run: |
          git config --global user.name "ApexGuard Threat Intelligence Bot"
          git config --global user.email "bot@apexguard.security"
          git add manifest.json updates/
          git commit -m "Auto-update threat database from global feeds [skip ci]" || echo "Tidak ada perubahan baru."
          git push
